<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>swish-loader self test</title>
    <link rel="stylesheet" href="../loader/swish-loader.css" />
    <style>
      body { font: 13px ui-monospace, Consolas, monospace; margin: 1rem; }
      #host { position: absolute; left: 0; top: 0; visibility: hidden; }
      .pass { color: #0a0; }
      .fail { color: #c00; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <pre id="out">running…</pre>

    <script type="module">
      import { createSwishLoader, TIMELINE, GEOMETRY as G } from '../loader/swish-loader.js';

      /**
       * Console errors the runner should NOT treat as failures: this suite
       * deliberately provokes them to prove the loader contains them. Anything
       * not listed here still fails the run.
       */
      window.__expectedConsoleErrors = ['[swish-loader] onComplete threw'];

      const host = document.getElementById('host');
      const results = [];
      const ok = (name, cond, detail = '') =>
        results.push({ name, pass: !!cond, detail: String(detail) });

      const settle = (ms = 60) => new Promise((r) => setTimeout(r, ms));
      const q = (root, sel) => root.querySelector(sel);
      const op = (node) => parseFloat(node.getAttribute('opacity') || '1');

      async function make(opts = {}) {
        const l = createSwishLoader({ mount: host, ...opts });
        // wait for the data-URI decode + start()
        for (let i = 0; i < 40 && !l.root.classList.contains('is-ready'); i++) await settle(25);
        return l;
      }

      async function run() {
        /* ---------- 1. structure & accessibility ---------- */
        {
          const l = await make({ loop: true });
          const r = l.root;
          ok('root is a live status region',
            r.getAttribute('role') === 'status' && r.getAttribute('aria-live') === 'polite');
          ok('svg hidden from assistive tech',
            q(r, 'svg').getAttribute('aria-hidden') === 'true');
          ok('screen-reader text present',
            q(r, '.swish-loader__sr')?.textContent.trim() === 'Loading, please wait');
          ok('display glyphs are live <text>, not a raster',
            q(r, 'svg').querySelectorAll('text').length === 10);
          ok('exactly two raster layers (bag + scale)',
            q(r, 'svg').querySelectorAll('image').length === 2,
            q(r, 'svg').querySelectorAll('image').length);
          ok('no full-scene raster anywhere',
            ![...q(r, 'svg').querySelectorAll('image')]
              .some((i) => /loading|falling|fell/i.test(i.getAttribute('href') || '')));
          l.destroy();
        }

        /* ---------- 2. timeline is a pure function of t ---------- */
        {
          const l = await make({ loop: true });
          const r = l.root;
          const bag = q(r, '.swish-loader__bag');
          const glyphs = [...q(r, 'svg').querySelectorAll('text')];

          l.__debug.scrub(0);
          const at0 = bag.getAttribute('transform');
          l.__debug.scrub(1500);
          l.__debug.scrub(0);
          ok('same t renders the same frame (pure)', bag.getAttribute('transform') === at0);

          const svgBox = () => q(r, 'svg').getBoundingClientRect();

          /* ---- entry: the bag comes DOWN INTO the frame from above it ----
             The reveal is the fall. getBoundingClientRect() reports the bag's
             full laid-out box whether or not the frame clips it, so the
             visible share is the overlap of that box with the stage. */
          const visible = (t) => {
            l.__debug.scrub(t);
            const sb = svgBox();
            const bb = bag.getBoundingClientRect();
            const shown = Math.min(bb.bottom, sb.bottom) - Math.max(bb.top, sb.top);
            return { frac: Math.max(0, shown) / bb.height, bb, sb };
          };
          {
            const v0 = visible(0);
            ok('only the bag base is in view at t=0',
              Math.abs(v0.frac - G.ENTRY_VISIBLE) < 0.03,
              `${(100 * v0.frac).toFixed(0)}% showing, want ${(100 * G.ENTRY_VISIBLE).toFixed(0)}%`);
            ok('the rest of the bag starts ABOVE the frame, not faded out',
              v0.bb.top < v0.sb.top - 1,
              `top edge ${(v0.bb.top - v0.sb.top).toFixed(0)}px above the stage`);
            // Not a fade: the node is fully opaque on the frame it is cropped.
            const img = q(r, '.swish-loader__bag').querySelector('image') ||
              q(r, '.swish-loader__bag');
            ok('entry uses motion, not opacity',
              parseFloat(img.getAttribute('opacity') ?? '1') === 1,
              img.getAttribute('opacity') ?? 'none set');

            // More of it every frame, never less, until it is whole.
            let prev = -1, regressed = [];
            for (let t = 0; t <= 600; t += 25) {
              const f = visible(t).frac;
              if (f < prev - 0.005) regressed.push(t);
              prev = f;
            }
            ok('more of the bag is in view every frame of the fall',
              regressed.length === 0,
              regressed.length ? `went backwards at ${regressed.join(',')}ms` : 'monotonic');

            // Whole well before contact, and whole for the landing itself.
            let wholeAt = null;
            for (let t = 0; t <= 600; t += 5) {
              if (visible(t).frac > 0.999) { wholeAt = t; break; }
            }
            ok('the whole bag is in view before it lands',
              wholeAt !== null && wholeAt < 600 - 120,
              wholeAt === null ? 'never whole' : `whole from ${wholeAt}ms, ${600 - wholeAt}ms before contact`);

            // The bottom edge is the one thing that must never be cropped:
            // the base is what the landing is read against.
            let lowCut = [];
            for (let t = 0; t <= 1200; t += 25) {
              const v = visible(t);
              if (v.bb.bottom > v.sb.bottom + 0.5) lowCut.push(t);
            }
            ok('the bag is never clipped at the BOTTOM', lowCut.length === 0,
              lowCut.length ? `clipped at ${lowCut.join(',')}ms` : 'base always in frame');
          }
          {
            l.__debug.scrub(0);
            const sb = svgBox();
            const bb = bag.getBoundingClientRect();
            const gap = (sb.top + sb.height * (G.PLATE_TOP_Y / G.VB_H)) - bb.bottom;
            ok('bag starts clearly above the scale', gap / sb.height > 0.25,
              `${(100 * gap / sb.height).toFixed(0)}% of stage above the plate`);
          }
          ok('an intro fade exists to cover the loop seam', TIMELINE.INTRO >= 100);

          /* ---- the fall: higher start, sway, settle ---- */
          const xf = (t) => { l.__debug.scrub(t); return bag.getAttribute('transform'); };
          const squash = q(r, '.swish-loader__bag-squash');
          // Every transform anywhere in the bag's subtree, for the whole cycle.
          const allXf = (t) => {
            l.__debug.scrub(t);
            return [bag, squash, ...bag.querySelectorAll('*')]
              .map((e) => e.getAttribute('transform') || '').join(' | ');
          };
          const yAt = (t) => parseFloat(/translate\(0 (-?[\d.]+)\)/.exec(xf(t))[1]);

          // 1. starts noticeably higher, and the height is travelled, not jumped
          ok('bag starts a full drop above its resting place',
            Math.abs(yAt(0) - G.DROP_FROM) < 0.5, `${yAt(0).toFixed(1)} vs ${G.DROP_FROM.toFixed(1)}`);
          ok('the drop is travelled continuously',
            yAt(0) < yAt(150) && yAt(150) < yAt(300) &&
            yAt(300) < yAt(450) && yAt(450) < yAt(580),
            [0, 150, 300, 450, 580].map(yAt).map((v) => v.toFixed(0)).join(' -> '));

          // 2. NEVER rotates. Not falling, not landing, not settling.
          {
            const samples = [];
            for (let t = 0; t <= 2700; t += 25) samples.push(t);
            // Not "rotation is zero" - there is no rotate() in the document to
            // BE non-zero. Same for skew and matrix, which could smuggle one in.
            const spun = samples.filter((t) => /rotate|skew|matrix/.test(allXf(t)));
            ok('no rotation exists anywhere in the bag subtree', spun.length === 0,
              spun.length ? `first at ${spun[0]}ms: ${allXf(spun[0])}`
                          : `clean across ${samples.length} frames`);

            // The fall itself is one term on one group, and nothing else.
            const bad = samples.filter(
              (t) => !/^translate\(0 -?[\d.]+\)$/.test(xf(t)));
            ok('the fall transform is translateY and nothing else',
              bad.length === 0,
              bad.length ? `first at ${bad[0]}ms: "${xf(bad[0])}"` : xf(300));
          }

          // 3. only y moves during the fall - x, rotation and scale are fixed
          {
            const sc = (t) => {
              l.__debug.scrub(t);
              const m = /scale\(([-\d.]+) ([-\d.]+)\)/.exec(
                squash.getAttribute('transform') || '');
              return m ? [parseFloat(m[1]), parseFloat(m[2])] : [NaN, NaN];
            };
            const fall = [0, 100, 200, 300, 400, 500, 599];
            ok('scale is unchanged throughout the fall',
              fall.every((t) => sc(t)[0] === 1 && sc(t)[1] === 1),
              fall.map((t) => sc(t).join('/')).join(' '));
            ok('y is the only thing moving during the fall',
              Math.abs(yAt(300) - yAt(250)) > 1 &&
              sc(300)[0] === sc(250)[0] && sc(300)[1] === sc(250)[1] &&
              xf(300).replace(/-?[\d.]+\)$/, '') === xf(250).replace(/-?[\d.]+\)$/, ''),
              `dy=${(yAt(300) - yAt(250)).toFixed(1)}`);
          }

          // 4. arrives level, and the bounce does not introduce any roll
          ok('bag reaches the scale perfectly level', !/rotate/.test(allXf(600)));
          {
            const seq = [600, 660, 700, 760, 840, 900, 960, 1040, 1120];
            ok('the bounce introduces no roll',
              seq.every((t) => !/rotate/.test(allXf(t))));
            // ...but it IS a bounce: the bag still compresses and springs.
            ok('the bounce is still there vertically',
              yAt(645) > yAt(600) && yAt(760) < yAt(600) - 5 * G.U,
              `${yAt(600).toFixed(1)} -> ${yAt(645).toFixed(1)} -> ${yAt(760).toFixed(1)}`);
          }

          // 6. ends exactly level, and stays there
          {
            const tail = [1200, 1400, 1700, 2100, 2500, 2700];
            ok('bag ends perfectly level and stays level',
              tail.every((t) => !/rotate/.test(allXf(t))));
            ok('resting transform is a pure vertical offset',
              /^translate\(0 -?[\d.]+\)$/.test(xf(2100)), xf(2100));
          }

          // 7. nothing teleports, nothing snaps - sampled every frame
          {
            let mr = 0, my = 0, mrAt = 0, myAt = 0;
            let py = yAt(0);
            for (let t = 16; t <= 1300; t += 16) {
              const cy = yAt(t);
              if (Math.abs(cy - py) > my) { my = Math.abs(cy - py); myAt = t; }
              py = cy;
            }
            ok('no rotation to snap', mr === 0, 'no rotate() exists');
            // 18-19u/frame is terminal velocity on a 420-unit stage; a seam
            // discontinuity would show up far above that.
            ok('position never teleports', my < 24, `max ${my.toFixed(1)}u at ${myAt}ms`);
          }

          // 7b. accelerates, then cushions into the plate (storyboard)
          {
            const speeds = [];
            for (let t = 32; t <= 600; t += 32) speeds.push({ t, v: Math.abs(yAt(t) - yAt(t - 32)) });
            const peak = speeds.reduce((a, b) => (b.v > a.v ? b : a));
            const atContact = speeds[speeds.length - 1].v;
            ok('the fall accelerates from rest',
              speeds[0].v < speeds[4].v && speeds[4].v < peak.v,
              `${speeds[0].v.toFixed(1)} -> ${speeds[4].v.toFixed(1)} -> ${peak.v.toFixed(1)}`);
            ok('it peaks before contact, not at it', peak.t < 560, `peak at ${peak.t}ms`);
            ok('it eases as it nears the plate', atContact < peak.v * 0.92,
              `${peak.v.toFixed(1)} -> ${atContact.toFixed(1)} u/frame ` +
              `(-${(100 * (1 - atContact / peak.v)).toFixed(0)}%)`);
          }

          // 7c. stays centred over the scale the whole way down.
          //
          // The structural guarantee first: the bag transform carries no
          // horizontal translation at all, and every rotation and scale is
          // about x = PIVOT_X. The bag physically cannot drift sideways.
          {
            let offAxis = 0;
            for (let t = 0; t <= 1200; t += 40) {
              // The whole transform must be translate(0 <y>). A literal 0 in
              // the x slot: there is no horizontal term to get wrong.
              if (!/^translate\(0 -?[\d.]+\)$/.test(xf(t))) offAxis++;
            }
            ok('bag transform has no horizontal term at all', offAxis === 0,
              `${offAxis} frames off-axis`);
            // The squash is symmetric about the stage centre, so widening on
            // impact cannot shift the bag sideways either.
            ok('impact squash is centred on the stage axis',
              new RegExp(`^translate\\(${G.VB_W / 2} `).test(
                (l.__debug.scrub(645), squash.getAttribute('transform'))),
              squash.getAttribute('transform'));
          }
          {
            const scaleG = q(r, '.swish-loader__scale');
            const off = (t) => {
              l.__debug.scrub(t);
              const bb = bag.getBoundingClientRect();
              const sc = scaleG.getBoundingClientRect();
              return bb.width ? (bb.left + bb.width / 2) - (sc.left + sc.width / 2) : 0;
            };
            let worst = 0, at = 0;
            for (let t = 0; t <= 1200; t += 40) {
              const d = Math.abs(off(t));
              if (d > worst) { worst = d; at = t; }
            }
            // Non-zero only because a tilted bag leans: the silhouette shifts
            // even though the axis does not. Bounded well under 4% of the
            // stage, and it has to be exactly zero once level.
            const sb = svgBox();
            ok('bag never drifts off centre, at any point', worst < 1,
              `${worst.toFixed(2)}px at ${at}ms`);
            ok('bag is exactly centred once settled',
              Math.abs(off(1200)) < 1 && Math.abs(off(2100)) < 1,
              `${off(1200).toFixed(2)} / ${off(2100).toFixed(2)} px`);
          }

          // 7d. the shadow answers to the bag's height
          {
            const shadowEl = q(r, 'ellipse');
            const sh = (t) => {
              l.__debug.scrub(t);
              const m = /scale\(([\d.]+)\)/.exec(shadowEl.getAttribute('transform') || '');
              return { o: op(shadowEl), s: m ? parseFloat(m[1]) : NaN };
            };
            const high = sh(60), mid = sh(350), down = sh(600);
            ok('shadow grows and darkens as the bag descends',
              high.s < mid.s && mid.s < down.s && high.o < mid.o && mid.o < down.o,
              `${high.o.toFixed(3)} -> ${mid.o.toFixed(3)} -> ${down.o.toFixed(3)}`);
            ok('shadow is tightest and darkest at contact',
              Math.abs(down.s - 1) < 0.001 && Math.abs(down.o - 0.2) < 0.001,
              `s=${down.s.toFixed(3)} o=${down.o.toFixed(3)}`);
            // Counter-beat: the bag climbs away on the rebound, so the shadow
            // must relax - and recover once it is back down.
            const reb = sh(760), back = sh(900);
            ok('shadow relaxes while the bag rebounds',
              reb.o < down.o - 0.005 && reb.s < down.s - 0.005,
              `${down.o.toFixed(3)} -> ${reb.o.toFixed(3)}`);
            ok('shadow recovers once the bag is down again',
              Math.abs(back.o - down.o) < 0.002, back.o.toFixed(3));
            // Height-driven, not clock-driven: same height => same shadow.
            const a = sh(1200), b2 = sh(2100);
            ok('shadow is a function of height, not of time',
              a.o === b2.o && a.s === b2.s, `${a.o} vs ${b2.o}`);
          }

          // 8. final resting position: flush on the plate, per the reference
          {
            l.__debug.scrub(2100);
            const sb = svgBox();
            const bb = bag.getBoundingClientRect();
            const bottomFrac = (bb.bottom - sb.top) / sb.height;
            const centreFrac = (bb.left + bb.width / 2 - sb.left) / sb.width;
            ok('bag rests flush on the plate',
              Math.abs(bottomFrac - G.BAG_REST_BOTTOM / G.VB_H) < 0.004,
              bottomFrac.toFixed(4));
            ok('bag rests centred on the scale', Math.abs(centreFrac - 0.5) < 0.01,
              centreFrac.toFixed(4));
          }

          // 9. never sinks into the plate beyond the intended squash.
          //
          // Measured against the SCALE, not a fixed line: the plate itself
          // compresses ~2.8u under the impact and the bag rides it down, so a
          // fixed reference reads that shared travel as penetration.
          {
            const scaleG = q(r, '.swish-loader__scale');
            const gap = (t) => {
              l.__debug.scrub(t);
              const sb2 = svgBox();
              return ((bag.getBoundingClientRect().bottom -
                       scaleG.getBoundingClientRect().top) / sb2.height) * 420;
            };
            const rest = gap(2100);          // the designed sink, ~30.7u
            let deepest = 0, at = 0, floated = 0, floatAt = 0;
            // From contact onward only - before 600ms the bag is supposed to
            // be in the air, so "floating" is not a defect there.
            for (let t = 600; t <= 1300; t += 10) {
              const d = gap(t) - rest;
              if (d > deepest) { deepest = d; at = t; }
              if (-d > floated) { floated = -d; floatAt = t; }
            }
            ok('bag never sinks into the scale beyond the squash', deepest < 4.5 * G.U,
              `${deepest.toFixed(2)}u at ${at}ms`);
            ok('bag never floats off the scale after contact', floated < 16 * G.U,
              `${floated.toFixed(2)}u at ${floatAt}ms (rebound is ~${(14 * G.U).toFixed(0)}u)`);
            ok('the designed sink is unchanged', Math.abs(rest - G.SINK) < 1.2,
              rest.toFixed(2));
          }

          l.__debug.scrub(900);
          ok('t=900 display still blank', glyphs.slice(0, 5).every((g) => op(g) === 0));

          /* ---- green scale indicator (initial-state requirement) ---- */
          {
            const led = q(r, '.swish-loader__led');
            ok('scale has a green indicator', !!led &&
              led.getAttribute('fill').toLowerCase() === '#00c853',
              led && led.getAttribute('fill'));

            // Lit at every point on the timeline, starting from the very
            // first frame - never waiting for the bag, never blinking.
            const samples = [0, 1, 150, 300, 450, 599, 600, 601, 900, 1049,
                             1051, 1200, 1500, 2100, 2400, 2700];
            const unlit = samples.filter((t) => { l.__debug.scrub(t); return op(led) < 1; });
            ok('indicator lit from the first frame and never drops',
              unlit.length === 0, `unlit at ${unlit.join(',')}ms`);

            // It must belong to the scale, so it inherits the scale's
            // transform rather than being placed independently.
            ok('indicator lives inside the scale group',
              q(r, '.swish-loader__scale').contains(led));
          /* ---- status indicator: Processing -> Weighing -> Done ----
             Four layers in one group: the pale disc, the grey track, ONE
             polyline that is the arc and then the check, and the burst.
             The arc and the check are the same element, so Done is a
             transform of the loading ring, not a replacement for it. */
          {
            const ringG = q(r, '.swish-loader__ring');
            l.__debug.scrub(600);            // a known loading frame
            const kids = [...ringG.children];
            ok('the indicator is one group of four layers',
              kids.length === 4 &&
              kids[0].tagName.toLowerCase() === 'circle' &&
              kids[2].tagName.toLowerCase() === 'polyline' &&
              kids[3].tagName.toLowerCase() === 'g',
              kids.map((e) => e.tagName).join(','));
            const [disc, track, arc, sparkG] = kids;

            ok('the pale disc is behind everything, in all states',
              disc.getAttribute('fill') === '#EDFCF3' &&
              Math.abs(parseFloat(disc.getAttribute('r')) - G.STATUS_D) < 0.01);
            ok('the track is a full grey ring',
              track.getAttribute('fill') === 'none' &&
              !/^#0/.test(track.getAttribute('stroke')) &&
              !track.hasAttribute('stroke-dasharray'));
            ok('the arc is green with round ends',
              arc.getAttribute('stroke') === '#01DA5C' &&
              arc.getAttribute('fill') === 'none' &&
              arc.getAttribute('stroke-linecap') === 'round');
            ok('the burst is four strokes',
              sparkG.children.length === 4 &&
              [...sparkG.children].every((e) => e.tagName.toLowerCase() === 'line'));
            ok('the indicator is centred on the scale, below the body',
              Math.abs(parseFloat(disc.getAttribute('cx')) - G.VB_W / 2) < 0.01 &&
              G.RING_CY - G.STATUS_D >= 392 && G.RING_CY + G.STATUS_D <= G.VB_H,
              `${(G.RING_CY - G.STATUS_D).toFixed(1)}..${(G.RING_CY + G.STATUS_D).toFixed(1)}`);

            const pts = (t) => {
              l.__debug.scrub(t);
              return arc.getAttribute('points').trim().split(/\s+/)
                .map((s) => s.split(',').map(Number));
            };
            const at = (t) => {
              const P = pts(t);
              const cx = G.VB_W / 2, cy = G.RING_CY;
              // Sweep as the SUM of the steps between consecutive points, not
              // the angle between the first and the last: a closed circle puts
              // those two on top of each other and would measure as zero.
              let sweep = 0;
              for (let i = 1; i < P.length; i++) {
                const a = Math.atan2(P[i - 1][1] - cy, P[i - 1][0] - cx);
                const b = Math.atan2(P[i][1] - cy, P[i][0] - cx);
                let d = b - a;
                while (d > Math.PI) d -= Math.PI * 2;
                while (d < -Math.PI) d += Math.PI * 2;
                sweep += d;
              }
              // How far every point is from the ring's radius: 0 while it is
              // a circle, large once it has become the check.
              const off = P.map(([x, y]) =>
                Math.abs(Math.hypot(x - cx, y - cy) - G.RING_R));
              return {
                n: P.length,
                sweep: sweep / (Math.PI * 2),
                onCircle: Math.max(...off) < 0.05,
                dev: Math.max(...off),
                track: +track.getAttribute('opacity'),
                spark: +sparkG.getAttribute('opacity'),
                w: parseFloat(arc.getAttribute('stroke-width'))
              };
            };

            /* --- phase 1: Processing -> Weighing, in step with the bag --- */
            const live = [0, 150, 300, 600, 900, 1100, 1199];
            ok('the arc is one polyline of a fixed point count',
              live.every((t) => at(t).n === at(0).n) && at(0).n > 40, at(0).n);
            ok('every point is on the ring while it loads',
              live.every((t) => at(t).onCircle),
              `worst deviation ${Math.max(...live.map((t) => at(t).dev)).toFixed(4)}`);
            const sweeps = live.map((t) => at(t).sweep);
            ok('the sweep only ever grows',
              sweeps.every((v, i) => i === 0 || v > sweeps[i - 1] - 1e-6),
              sweeps.map((v) => (100 * v).toFixed(0) + '%').join(' '));

            // Measured off the reference: 28% Processing, 65% Weighing.
            ok('it starts on the reference Processing sweep',
              Math.abs(at(0).sweep - 0.28) < 0.02,
              `${(100 * at(0).sweep).toFixed(0)}% (ref 28%)`);
            // T_SETTLE_END is the instant the bag stops moving: that is what
            // "synchronised with the bag" has to mean, not a nearby number.
            ok('it reaches the reference Weighing sweep as the bag settles',
              Math.abs(at(TIMELINE.SETTLE_END).sweep - 0.65) < 0.02,
              `${(100 * at(TIMELINE.SETTLE_END).sweep).toFixed(0)}% at ${TIMELINE.SETTLE_END}ms (ref 65%)`);
            ok('the circle closes exactly as the readout finishes',
              at(TIMELINE.COUNT_END - 1).sweep > 0.99,
              `${(100 * at(TIMELINE.COUNT_END - 1).sweep).toFixed(1)}%`);
            ok('nothing of Done shows while it is still loading',
              live.every((t) => { const v = at(t); return v.track === 1 && v.spark === 0; }));

            /* --- phase 2: the morph --- */
            const morph = [2100, 2180, 2260, 2340, 2420, 2520].map(at);
            ok('the point count never changes through the morph',
              morph.every((v) => v.n === at(0).n));
            ok('the stroke starts on the circle and ends well off it',
              morph[0].dev < 0.05 && morph[morph.length - 1].dev > G.RING_R / 2,
              morph.map((v) => v.dev.toFixed(2)).join(' '));
            // A morph, not a cut. Sampled 80ms apart, so a real 60fps frame
            // moves about a fifth of what is allowed here; what this rules
            // out is a step, not slow motion.
            ok('no frame of the morph jumps',

              l.__debug.scrub(780);
              const a = strokes.map((ln) => ln.getAttribute('x1') + ',' + ln.getAttribute('y1')).join('|');
              l.root.style.setProperty('--swish-size', '520px');
              l.__debug.scrub(780);
              const b2 = strokes.map((ln) => ln.getAttribute('x1') + ',' + ln.getAttribute('y1')).join('|');
              ok('mark geometry is resolution-independent', a === b2);
              l.root.style.removeProperty('--swish-size');
            }
          }

          // A replayed loop must not start with lines left on screen.
          { l.__debug.scrub(2100); l.__debug.scrub(0);
            ok('no streaks left over when the loop restarts', op(streaks) === 0); }

          // Painted before the bag, so the bag always covers them.
          {
            const kids = [...q(r, 'svg').children];
            ok('streaks paint behind the bag',
              kids.indexOf(streaks) < kids.indexOf(bag));
          }

          // Anchored to the bag's live position, not to anything fixed.
          {
            l.__debug.scrub(450);
            ok('streaks share the bag\'s exact vertical transform',
              streaks.getAttribute('transform') === bag.getAttribute('transform'),
              streaks.getAttribute('transform'));
            ok('and that transform is itself translateY-only',
              /^translate\(0 -?[\d.]+\)$/.test(streaks.getAttribute('transform')));
          }

          // Never off the sides of the stage.
          {
            l.__debug.scrub(450);
            const sb = svgBox();
            const bad = [...streaks.querySelectorAll('line')].filter((ln) => {
              const b = ln.getBoundingClientRect();
              return b.left < sb.left - 0.5 || b.right > sb.right + 0.5;
            });
            ok('streaks never clip the sides', bad.length === 0, `${bad.length} outside`);
          }

          // Same geometry at every stage size: all of it is viewBox units.
          {
            l.root.style.setProperty('--swish-size', '160px');
            l.__debug.scrub(450);
            const small = streaks.getAttribute('transform');
            const smallD = streaks.querySelector('line').getAttribute('y2');
            l.root.style.setProperty('--swish-size', '520px');
            l.__debug.scrub(450);
            ok('streak geometry is resolution-independent',
              streaks.getAttribute('transform') === small &&
              streaks.querySelector('line').getAttribute('y2') === smallD);
            l.root.style.removeProperty('--swish-size');
          }

          // letters must not shift once revealed
          l.__debug.scrub(1400);
          const sAt1400 = glyphs[0].parentNode.getAttribute('transform');
          l.__debug.scrub(2100);
          ok('revealed glyphs never move',
            glyphs[0].parentNode.getAttribute('transform') === sAt1400);

          l.destroy();
        }

        /* ---------- 3. reduced motion ---------- */
        {
          const l = await make({ reducedMotion: true });
          const glyphs = [...q(l.root, 'svg').querySelectorAll('text')];
          ok('reduced motion renders the final state',
            glyphs.slice(0, 5).every((g) => op(g) > 0.9));
          ok('reduced motion runs no rAF loop',
            !l.root.classList.contains('is-animating'));
          ok('reduced motion marks the static class',
            l.root.classList.contains('is-static'));
          l.destroy();
        }

        /* ---------- 4. degraded mode ---------- */
        {
          const l = await make({ loop: true });
          l.__debug.setDegraded();
          l.__debug.scrub(700);
          ok('degraded leaves no filter on the readout',
            !q(l.root, '.swish-loader__display').hasAttribute('filter'));
          ok('degraded keeps the bag moving',
            /^translate\(0 -?[\d.]+\)$/.test(
              q(l.root, '.swish-loader__bag').getAttribute('transform')),
            q(l.root, '.swish-loader__bag').getAttribute('transform'));
          l.__debug.scrub(450);
          ok('degraded keeps the motion streaks (they are nearly free)',
            op(q(l.root, '.swish-loader__streaks')) > 0);
          l.__debug.scrub(650);
          ok('degraded sheds the impact marks',
            [...q(l.root, '.swish-loader__impact').children].every((g) => op(g) === 0));
          l.destroy();
        }

        /* ---------- 5. lifecycle & cleanup ---------- */
        {
          const l = await make({ loop: false, minDuration: 0 });
          const before = host.childElementCount;
          l.destroy();
          ok('destroy removes the DOM', host.childElementCount === before - 1);
          ok('destroy is idempotent', (() => { try { l.destroy(); return true; } catch { return false; } })());
        }
        {
          let completed = false;
          const l = await make({ loop: true, minDuration: 0, onComplete: () => { completed = true; } });
          l.finish();
          await settle(700);
          ok('finish() fires onComplete after the exit fade', completed);
          ok('finish() marks completion', l.isDone());
          l.destroy();
        }
        {
          // minDuration must prevent a flash
          const t0 = performance.now();
          let at = 0;
          const l = await make({ loop: true, minDuration: 900, onComplete: () => { at = performance.now() - t0; } });
          l.finish();
          await settle(1600);
          ok('minDuration prevents a flash', at >= 850, `${at.toFixed(0)}ms`);
          l.destroy();
        }
        {
          let calls = 0;
          const l = await make({ loop: true, minDuration: 0, onComplete: () => { calls++; } });
          l.finish(); l.finish(); l.finish();
          await settle(700);
          ok('repeated finish() calls complete exactly once', l.isDone() && calls === 1,
            `isDone=${l.isDone()} calls=${calls}`);
          l.destroy();
        }
        {
          // destroy() mid-wait must not fire a callback into a dead loader
          let fired = false;
          const l = await make({ loop: true, minDuration: 900, onComplete: () => { fired = true; } });
          l.finish();
          l.destroy();
          await settle(1400);
          ok('destroy() during minDuration cancels the pending finish', !fired);
        }
        {
          let threw = false;
          try { createSwishLoader({}); } catch { threw = true; }
          ok('missing mount throws a clear error', threw);
        }
        {
          // a throwing onComplete must not wedge the loader
          const l = await make({ loop: true, minDuration: 0, onComplete: () => { throw new Error('boom'); } });
          l.finish();
          await settle(600);
          ok('a throwing onComplete is contained', l.isDone());
          l.destroy();
        }

        /* ---------- 6. responsiveness ---------- */
        {
          const l = await make({ loop: true });
          const svg = q(l.root, 'svg');
          ok('viewBox present', svg.getAttribute('viewBox') === '0 0 400 420');
          ok('no hard-coded pixel width/height on the svg',
            !svg.hasAttribute('width') && !svg.hasAttribute('height'));
          for (const px of [140, 320, 900]) {
            l.root.style.setProperty('--swish-size', px + 'px');
            const r = q(l.root, '.swish-loader__stage').getBoundingClientRect();
            ok(`stage keeps 400:420 aspect at ${px}px`,
              Math.abs(r.width / r.height - 400 / 420) < 0.02,
              (r.width / r.height).toFixed(4));
          }
          l.destroy();
        }

        /* ---------- report ---------- */
        const failed = results.filter((r) => !r.pass);
        document.getElementById('out').innerHTML =
          results
            .map((r) => `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>  ${r.name}${r.detail && !r.pass ? '   [' + r.detail + ']' : ''}`)
            .join('\n') +
          `\n\nRESULT ${results.length - failed.length}/${results.length} passed`;
        document.title = failed.length ? `FAIL ${failed.length}` : 'ALL PASS';
      }

      run().catch((e) => {
        document.getElementById('out').textContent = 'HARNESS ERROR: ' + (e && e.stack || e);
        document.title = 'HARNESS ERROR';
      });
    </script>
  </body>
</html>
